description = '''
Create: CoinMarket is a server-authoritative live market and auction house for NeoForge 1.21.1.

Features:
- Modern dark marketplace dashboard
- Create: Numismatics coin and bank-card support
- SQLite-backed listings and analytics
- Public and admin market listings
- In-UI auction notifications
- Server-validated buy, sell, cancel, and collect flows
'''

